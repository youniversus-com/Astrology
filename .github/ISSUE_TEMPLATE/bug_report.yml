name: Bug report
description: Report a problem with YoUniverse Astrology
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open chart for ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 1.1.59 or git commit
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS / desktop
      options:
        - Debian / Ubuntu
        - Fedora / RHEL
        - Other Linux
        - macOS
        - Windows (MSYS2)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell

name: Verify signed release tag

on:
  push:
    tags: ['v*']

jobs:
  verify-tag-signature:
    name: Verify tag OpenPGP signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import release signing key
        run: |
          gpg --batch --import .github/gpg/release-signing.asc
          gpg --list-keys --keyid-format long

      - name: Require signed annotated tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Verifying signature on tag: ${TAG}"

          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != tag ]]; then
            echo "::error::Tag ${TAG} is not an annotated tag. Create with: git tag -s ${TAG} -m 'Release ...'"
            exit 1
          fi

          set +e
          VERIFY_OUTPUT="$(git tag -v "${TAG}" 2>&1)"
          VERIFY_STATUS=$?
          set -e
          echo "${VERIFY_OUTPUT}"

          if [[ ${VERIFY_STATUS} -ne 0 ]]; then
            if grep -q "No public key" <<< "${VERIFY_OUTPUT}"; then
              echo "::error::Tag ${TAG} is signed with an unknown key. Update .github/gpg/release-signing.asc."
            elif grep -q "BAD signature" <<< "${VERIFY_OUTPUT}"; then
              echo "::error::Tag ${TAG} has an invalid OpenPGP signature."
            else
              echo "::error::Tag ${TAG} is not signed. Create with: git tag -s ${TAG} -m 'Release ...'"
            fi
            exit 1
          fi

          echo "Tag ${TAG} is signed and verified."

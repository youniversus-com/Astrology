version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns:
          - pytest*
          - ruff
          - sphinx
          - pyright
          - mypy
          - hypothesis
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

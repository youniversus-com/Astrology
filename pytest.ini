[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --tb=short -m "not slow"
timeout = 120
markers =
    unit: pure logic tests (no application window; fast)
    gui: headless GTK integration tests (requires Xvfb)
    golden: SVG snapshot regression (runs with GUI fixtures)
    release: post-install smoke checks (venv, imports)
    slow: optional property/benchmark tests (excluded by default addopts)
    screenshot: documentation PNG capture/verification (docs/screenshots/)
filterwarnings =
    ignore::DeprecationWarning
